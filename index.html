<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Staying Alive – Moves</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --red: #e8192c;
      --dark: #0f0f0f;
      --card: #1a1a1a;
      --border: rgba(255,255,255,0.07);
      --text: #f0f0f0;
      --muted: #666;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--dark);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
    }

    /* Subtle grain overlay */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      background-size: 180px;
      pointer-events: none;
      z-index: 100;
      opacity: 0.4;
    }

    /* Header */
    header {
      text-align: center;
      padding: 56px 24px 40px;
      position: relative;
    }

    header::after {
      content: '';
      display: block;
      width: 48px;
      height: 3px;
      background: var(--red);
      margin: 24px auto 0;
      border-radius: 2px;
    }

    .eyebrow {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--red);
      margin-bottom: 10px;
    }

    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(52px, 10vw, 96px);
      letter-spacing: 0.05em;
      line-height: 1;
      color: var(--text);
    }

    h1 em {
      color: var(--red);
      font-style: normal;
    }

    .subtitle {
      margin-top: 12px;
      font-size: 14px;
      color: var(--muted);
      letter-spacing: 0.03em;
    }

    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      padding: 0 24px 64px;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Card */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      position: relative;
      transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
      animation: fadeUp 0.5s ease both;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(232, 25, 44, 0.35);
      box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 0 1px rgba(232,25,44,0.15);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card:nth-child(1)  { animation-delay: 0.02s; }
    .card:nth-child(2)  { animation-delay: 0.05s; }
    .card:nth-child(3)  { animation-delay: 0.08s; }
    .card:nth-child(4)  { animation-delay: 0.11s; }
    .card:nth-child(5)  { animation-delay: 0.14s; }
    .card:nth-child(6)  { animation-delay: 0.17s; }
    .card:nth-child(7)  { animation-delay: 0.20s; }
    .card:nth-child(8)  { animation-delay: 0.23s; }
    .card:nth-child(9)  { animation-delay: 0.26s; }
    .card:nth-child(10) { animation-delay: 0.29s; }
    .card:nth-child(11) { animation-delay: 0.32s; }
    .card:nth-child(12) { animation-delay: 0.35s; }
    .card:nth-child(13) { animation-delay: 0.38s; }
    .card:nth-child(14) { animation-delay: 0.41s; }
    .card:nth-child(15) { animation-delay: 0.44s; }
    .card:nth-child(16) { animation-delay: 0.47s; }

    .gif-wrap {
      width: 100%;
      aspect-ratio: 16/9;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .gif-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-top: 1px solid var(--border);
    }

    .step-label {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 0.08em;
      color: var(--text);
    }

    .step-num {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.15em;
      color: var(--red);
      background: rgba(232,25,44,0.1);
      border: 1px solid rgba(232,25,44,0.2);
      border-radius: 20px;
      padding: 3px 10px;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 24px;
      font-size: 12px;
      color: var(--muted);
      border-top: 1px solid var(--border);
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

  <header>
    <p class="eyebrow">Moves</p>
    <h1>Staying <em>Alive</em></h1>
  
  </header>

  <main class="grid" id="grid"></main>

  <footer>bookmark this page for quick access</footer>

  <script>
    const TOTAL = 16;
    const grid = document.getElementById('grid');

    for (let i = 1; i <= TOTAL; i++) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="gif-wrap">
          <img src="staying-alive_${i}.gif" alt="Staying alive ${i}" loading="lazy" />
        </div>
        <div class="card-footer">
          <span class="step-label">Move ${i}</span>
        </div>
      `;
      grid.appendChild(card);
    }
  </script>

</body>
</html>
